<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Sujay Jairaman</title>
  <meta name="robots" content="noindex">
  <style>
    :root{--bg:#fbfbf9;--fg:#1b1b1a;--muted:#6b6b66}
    @media (prefers-color-scheme:dark){:root{--bg:#111110;--fg:#ececea;--muted:#9a9a94}}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
      font:16px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
    h1{font-size:40px;margin:0;letter-spacing:-.03em}
    p{color:var(--muted);margin:4px 0 16px}
    a{color:inherit;text-underline-offset:3px}
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page took a wrong turn.</p>
    <a id="home" href="/">← back home</a>
  </div>
  <script>
    // Works for both user sites (name.github.io) and project sites (name.github.io/repo).
    var seg = location.pathname.split("/")[1];
    if (/\.github\.io$/.test(location.hostname) && seg && !/^[^.]+\.github\.io$/.test(seg)) {
      fetch("/" + seg + "/", { method: "HEAD" }).then(function (r) { if (r.ok) document.getElementById("home").href = "/" + seg + "/"; });
    }
  </script>
</body>
</html>
